# Kafka Connect Log4j Configuration with Enhanced Connector Logging

# Root logger
log4j.rootLogger=INFO, stdout, connectAppender

# Console appender
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=[%d] %p %m (%c)%n

# File appender for Kafka Connect
log4j.appender.connectAppender=org.apache.log4j.RollingFileAppender
log4j.appender.connectAppender.File=/var/log/kafka-connect/connect.log
log4j.appender.connectAppender.MaxFileSize=100MB
log4j.appender.connectAppender.MaxBackupIndex=10
log4j.appender.connectAppender.layout=org.apache.log4j.PatternLayout
log4j.appender.connectAppender.layout.ConversionPattern=[%d{ISO8601}] %p %c{1} - %m%n

# Connector-specific appender
log4j.appender.connectorAppender=org.apache.log4j.RollingFileAppender
log4j.appender.connectorAppender.File=/var/log/kafka-connect/kafka-replicator.log
log4j.appender.connectorAppender.MaxFileSize=50MB
log4j.appender.connectorAppender.MaxBackupIndex=5
log4j.appender.connectorAppender.layout=org.apache.log4j.PatternLayout
log4j.appender.connectorAppender.layout.ConversionPattern=[%d{ISO8601}] %p %c{2} - %m%n

# Kafka Connect framework
log4j.logger.org.apache.kafka.connect=INFO, connectAppender
log4j.additivity.org.apache.kafka.connect=false

# Custom connector - DEBUG level with dedicated log file
log4j.logger.com.octavalo.kafka.connector=DEBUG, connectorAppender, stdout
log4j.additivity.com.octavalo.kafka.connector=false

# Kafka clients
log4j.logger.org.apache.kafka.clients=WARN

# Reduce noise from these packages
log4j.logger.org.apache.kafka.common.utils=WARN
log4j.logger.org.apache.kafka.common.metrics=WARN
log4j.logger.org.reflections=ERROR
